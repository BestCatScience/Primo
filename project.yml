name: Primo
options:
  deploymentTarget:
    iOS: 26.0
packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    exactVersion: 1.25.2
  PrimoModules:
    path: Packages/PrimoModules
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.bestcatscience.primo
    SWIFT_VERSION: 5.10
targets:
  Primo:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        INFOPLIST_FILE: App/Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Primo
        PRODUCT_NAME: Primo
        TARGETED_DEVICE_FAMILY: 2
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        CLANG_ENABLE_OBJC_ARC: YES
    dependencies:
      - package: ComposableArchitecture
      - package: PrimoModules
        product: PrimoDocumentEngineInfrastructure
      - package: PrimoModules
        product: PrimoDocumentRenderingInfrastructure
      - package: PrimoModules
        product: PrimoDocumentTimelapseInfrastructure
      - package: PrimoModules
        product: PrimoDocumentInfrastructure
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: UIKit.framework
    scheme:
      testTargets: []
