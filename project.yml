name: Primo
options:
  deploymentTarget:
    iOS: 26.0
packages:
  ComposableArchitecture:
    url: https://github.com/BestCatScience/swift-composable-architecture
    revision: 8970b5088dbcde3c4e8d2c88e52f46a74f2f6071
  CasePaths:
    url: https://github.com/pointfreeco/swift-case-paths
    exactVersion: 1.7.2
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks
    exactVersion: 1.0.6
  CombineSchedulers:
    url: https://github.com/pointfreeco/combine-schedulers
    exactVersion: 1.1.0
  ConcurrencyExtras:
    url: https://github.com/pointfreeco/swift-concurrency-extras
    exactVersion: 1.3.2
  CustomDump:
    url: https://github.com/pointfreeco/swift-custom-dump
    exactVersion: 1.5.0
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    exactVersion: 1.11.0
  IdentifiedCollections:
    url: https://github.com/pointfreeco/swift-identified-collections
    exactVersion: 1.1.1
  IssueReporting:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    exactVersion: 1.9.0
  Perception:
    url: https://github.com/pointfreeco/swift-perception
    exactVersion: 2.0.9
  Sharing:
    url: https://github.com/pointfreeco/swift-sharing
    exactVersion: 2.7.4
  SwiftNavigation:
    url: https://github.com/BestCatScience/swift-navigation
    revision: 86539f79492bd7188da219a96dc0053a6e3a327b
  PrimoModules:
    path: Packages/PrimoModules
settings:
  base:
    APP_INTENTS_METADATA_PROCESSOR_FLAGS: --quiet-warnings
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.bestcatscience.primo
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    SWIFT_VERSION: 6.0
targets:
  PrimoAppSupport:
    type: framework
    platform: iOS
    sources:
      - path: App/Support
        excludes:
          - ThirdPartyNotices.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestcatscience.primo.support
        PRODUCT_NAME: PrimoAppSupport
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        CLANG_ENABLE_OBJC_ARC: YES
    dependencies:
      - package: ComposableArchitecture
      - package: Dependencies
        product: Dependencies
      - package: PrimoModules
        product: PrimoCoreTypes
      - package: PrimoModules
        product: PrimoSystemClients
      - package: PrimoModules
        product: PrimoLocalization
      - package: PrimoModules
        product: PrimoDocumentDomain
      - package: PrimoModules
        product: PrimoBrushFileFormats
      - package: PrimoModules
        product: PrimoBrushRuntime
      - package: PrimoModules
        product: PrimoWorkspaceRuntime
      - package: PrimoModules
        product: PrimoAIImageRuntime
      - sdk: Foundation.framework
      - sdk: UIKit.framework
  Primo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Support/ThirdPartyNotices.json
      - path: App/Support/ThirdPartyNotices.json
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: App/Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Primo
        AIIMAGE_PROXY_ENDPOINT: ""
        PRODUCT_NAME: Primo
        TARGETED_DEVICE_FAMILY: 2
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        CLANG_ENABLE_OBJC_ARC: YES
    dependencies:
      - target: PrimoAppSupport
      - package: ComposableArchitecture
      - package: CasePaths
        product: CasePaths
      - package: CasePaths
        product: CasePathsCore
      - package: Clocks
      - package: CombineSchedulers
      - package: ConcurrencyExtras
      - package: CustomDump
      - package: Dependencies
        product: Dependencies
      - package: Dependencies
        product: DependenciesMacros
      - package: IdentifiedCollections
      - package: IssueReporting
      - package: Perception
        product: Perception
      - package: Perception
        product: PerceptionCore
      - package: Sharing
      - package: PrimoModules
        product: PrimoWorkspaceApplication
      - package: PrimoModules
        product: PrimoCanvasInputDomain
      - package: PrimoModules
        product: PrimoCanvasPresentationDomain
      - package: PrimoModules
        product: PrimoDocumentRuntime
      - package: PrimoModules
        product: PrimoDocumentAppSupport
      - package: PrimoModules
        product: PrimoCanvasPresentationRuntime
      - package: PrimoModules
        product: PrimoDocumentStrokeApplication
      - package: PrimoModules
        product: PrimoAIImageDomain
      - package: PrimoModules
        product: PrimoAIImageApplication
      - sdk: AVFoundation.framework
      - sdk: AppIntents.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: UIKit.framework
    scheme:
      testTargets:
        - PrimoTests
  PrimoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrimoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestcatscience.primo.tests
        PRODUCT_NAME: PrimoTests
        TARGETED_DEVICE_FAMILY: 2
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Primo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Primo"
    dependencies:
      - target: Primo
      - package: ComposableArchitecture
      - package: CasePaths
        product: CasePaths
      - package: CasePaths
        product: CasePathsCore
      - package: Clocks
      - package: CombineSchedulers
      - package: ConcurrencyExtras
      - package: CustomDump
      - package: Dependencies
        product: Dependencies
      - package: Dependencies
        product: DependenciesMacros
      - package: IdentifiedCollections
      - package: IssueReporting
      - package: Perception
        product: Perception
      - package: Perception
        product: PerceptionCore
      - package: Sharing
      - package: PrimoModules
        product: PrimoCoreTypes
      - package: PrimoModules
        product: PrimoDocumentApplication
      - package: PrimoModules
        product: PrimoBrushRuntimeContracts
      - package: PrimoModules
        product: PrimoDocumentContracts
      - package: PrimoModules
        product: PrimoDocumentMutationContracts
      - package: PrimoModules
        product: PrimoDocumentPersistenceContracts
      - package: PrimoModules
        product: PrimoDocumentPresentationContracts
      - package: PrimoModules
        product: PrimoDocumentRenderingContracts
      - package: PrimoModules
        product: PrimoDocumentDomain
      - package: PrimoModules
        product: PrimoDocumentRuntime
      - package: PrimoModules
        product: PrimoDocumentRuntimeLive
      - package: PrimoModules
        product: PrimoCanvasPresentationRuntime
      - package: PrimoModules
        product: PrimoDocumentGPUContracts
      - package: PrimoModules
        product: PrimoBrushRuntime
      - package: PrimoModules
        product: PrimoDocumentStrokeApplication
      - package: PrimoModules
        product: PrimoAIImageApplication
      - package: PrimoModules
        product: PrimoAIImageDomain
      - package: PrimoModules
        product: PrimoAIImageRuntime
      - package: PrimoModules
        product: PrimoWorkspaceApplication
      - package: PrimoModules
        product: PrimoWorkspaceRuntime
