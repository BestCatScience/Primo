name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Swift 6 Package Tests (iOS 17/macOS 13)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      SWIFT_TOOLS_VERSION: "6.0"
      PACKAGE_IOS_DEPLOYMENT_TARGET: "17"
      PACKAGE_MACOS_DEPLOYMENT_TARGET: "13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Validate package toolchain and platforms
        run: |
          grep -q "// swift-tools-version: ${SWIFT_TOOLS_VERSION}" Packages/PrimoModules/Package.swift
          grep -q ".iOS(.v${PACKAGE_IOS_DEPLOYMENT_TARGET})" Packages/PrimoModules/Package.swift
          grep -q ".macOS(.v${PACKAGE_MACOS_DEPLOYMENT_TARGET})" Packages/PrimoModules/Package.swift

      - name: Run package tests
        working-directory: Packages/PrimoModules
        run: swift test

  app-tests:
    name: Swift 6 Xcode App Tests (iOS 26)
    runs-on: macos-26
    timeout-minutes: 35
    env:
      APP_SWIFT_VERSION: "6.0"
      APP_IOS_DEPLOYMENT_TARGET: "26.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Validate app toolchain and deployment target
        run: |
          grep -q "SWIFT_VERSION: ${APP_SWIFT_VERSION}" project.yml
          grep -q "iOS: ${APP_IOS_DEPLOYMENT_TARGET}" project.yml
          grep -q "SWIFT_VERSION = ${APP_SWIFT_VERSION};" Primo.xcodeproj/project.pbxproj
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = ${APP_IOS_DEPLOYMENT_TARGET};" Primo.xcodeproj/project.pbxproj

      - name: Resolve package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Primo.xcodeproj \
            -scheme Primo \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Patch SwiftNavigation manifest
        run: scripts/patch-swift-navigation-package.sh

      - name: Pick simulator
        id: simulator
        run: |
          xcrun simctl list devices available
          simulator_id="$(
            xcrun simctl list devices available -j | ruby -rjson -e '
              devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
              destinations = devices.select do |device|
                device["isAvailable"] &&
                  device["udid"] &&
                  (device["name"].start_with?("iPad") || device["name"].start_with?("iPhone"))
              end
              preferred = destinations.find { |device| device["name"].start_with?("iPad") } ||
                destinations.find { |device| device["name"].start_with?("iPhone") }
              abort("No available iOS simulator destination found") unless preferred
              puts preferred["udid"]
            '
          )"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run Xcode app tests
        run: |
          xcodebuild \
            -project Primo.xcodeproj \
            -scheme Primo \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -skipMacroValidation \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            test
